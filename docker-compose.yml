services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: clipping-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Chicago
      - GENERIC_TIMEZONE=America/Chicago
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
